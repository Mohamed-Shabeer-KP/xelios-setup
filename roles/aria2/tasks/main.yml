- name: Install aria2
  shell: pkg install -y aria2

- name: Create aria2 config
  copy:
    dest: ~/.aria2.conf
    content: |
      enable-rpc=true
      rpc-listen-all=true
      rpc-allow-origin-all=true
      rpc-listen-port=6800
      dir=~/storage/shared/download
      continue=true
    mode: '0644'

- name: Create start script
  copy:
    dest: ~/start-aria2.sh
    content: |
      #!/data/data/com.termux/files/usr/bin/bash
      aria2c --conf-path=~/.aria2.conf
    mode: '0755'